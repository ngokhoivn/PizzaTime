<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng đặt món - PizzaTime</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            margin-bottom: 20px;
            position: relative;
        }

        h1 {
            margin-bottom: 10px;
        }

        .table-info {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            padding: 10px;
            background-color: #f0f8ff;
            border-radius: 8px;
            border: 1px solid #b0c4de;
        }

        .cart-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
        }

            .cart-icon img {
                width: 40px;
            }

        #cart-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #ff0000;
            color: white;
            border-radius: 50%;
            padding: 5px 10px;
            font-size: 0.8rem;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

            .modal-content button {
                background-color: #4CAF50;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                margin-top: 20px;
            }

                .modal-content button:hover {
                    background-color: #45a049;
                }

        /* Cart-specific styles from cart.html */
        .cart-modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 800px;
            width: 90%;
            text-align: left;
        }

        .order-summary {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

            .order-summary h2 {
                border-bottom: 2px solid #4CAF50;
                padding-bottom: 10px;
                margin-bottom: 15px;
                color: #4CAF50;
            }

        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #eee;
        }

        .submit-order {
            display: block;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 20px;
        }

            .submit-order:hover {
                background-color: #45a049;
            }

            .submit-order:disabled {
                background-color: #cccccc;
                cursor: not-allowed;
            }

        .close-cart-btn {
            display: block;
            width: 100%;
            background-color: #666;
            color: white;
            padding: 15px;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
        }

            .close-cart-btn:hover {
                background-color: #555;
            }

        .empty-order {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PizzaTime</h1>
            <p>Chọn món ưa thích của bạn</p>
            <div class="cart-icon" id="cart-icon">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/shopping-cart.png" alt="Cart">
                <span id="cart-badge">0</span>
            </div>
        </header>
        <div class="table-info" id="tableInfo">Đang tải thông tin bàn...</div>
        <div id="menu-container"></div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="cart-modal-content">
            <h2>Giỏ hàng của bạn</h2>
            <div class="order-summary" id="orderSummary">
                <div id="orderItems"></div>
                <div class="total">
                    <span>Tổng cộng:</span>
                    <span id="totalAmount">0 ₫</span>
                </div>
                <button class="submit-order" disabled>Đặt món</button>
                <button class="close-cart-btn" onclick="closeCartModal()">Đóng</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="cart.js"></script>
</body>
</html>
