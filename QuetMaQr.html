<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng đặt món - PizzaTime</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .table-info {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            padding: 10px;
            background-color: #f0f8ff;
            border-radius: 8px;
            border: 1px solid #b0c4de;
        }

        .order-summary {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

            .order-summary h2 {
                border-bottom: 2px solid #4CAF50;
                padding-bottom: 10px;
                margin-bottom: 15px;
                color: #4CAF50;
            }

        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #eee;
        }

        .submit-order {
            display: block;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 20px;
        }

            .submit-order:hover {
                background-color: #45a049;
            }

            .submit-order:disabled {
                background-color: #cccccc;
                cursor: not-allowed;
            }

        .empty-order {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
        }

        .modal-content {
            background-color: white;
            margin: 20% auto;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            text-align: center;
        }

        .modal-message {
            margin-bottom: 20px;
        }

        .modal-btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        /* Thêm style cho danh sách bàn và menu pizza */
        #table-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .table-btn {
            padding: 10px 20px;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            background-color: #fff;
            color: #333;
            cursor: pointer;
        }

            .table-btn:hover {
                background-color: #4CAF50;
                color: #fff;
            }

        #menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .pizza-card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .pizza-image img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .pizza-name {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .pizza-description {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .size-controls {
            margin-top: 10px;
        }

        .size-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .size-label {
            font-weight: bold;
        }

        .size-price {
            color: #e91e63;
            margin-left: 5px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background-color: #ddd;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

            .quantity-btn:hover {
                background-color: #bbb;
            }

        .quantity-value {
            margin: 0 10px;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PizzaTime</h1>
            <p>Chọn món ưa thích của bạn</p>
        </header>
        <div class="table-info" id="tableInfo">Đang tải thông tin bàn...</div>
        <div class="order-summary" id="orderSummary">
            <h2>Tóm tắt đơn hàng</h2>
            <div id="orderItems">
                <div class="empty-order">Giỏ hàng trống. Vui lòng chọn pizza!</div>
            </div>
            <div class="total">
                <span>Tổng cộng:</span>
                <span id="totalAmount">0 ₫</span>
            </div>
            <button class="submit-order" disabled>Đặt món</button>
        </div>
    </div>
    <div class="modal" id="confirmationModal">
        <div class="modal-content">
            <div class="modal-message" id="modalMessage"></div>
            <button class="modal-btn" onclick="closeModal()">Đóng</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
