<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng đặt món - PizzaTime</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            margin-bottom: 20px;
            position: relative;
        }

        h1 {
            margin-bottom: 10px;
        }

        .table-info {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            padding: 10px;
            background-color: #f0f8ff;
            border-radius: 8px;
            border: 1px solid #b0c4de;
        }

        .cart-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
        }

            .cart-icon img {
                width: 40px;
            }

        #cart-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #ff0000;
            color: white;
            border-radius: 50%;
            padding: 5px 10px;
            font-size: 0.8rem;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

            .modal-content button {
                background-color: #4CAF50;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                margin-top: 20px;
            }

                .modal-content button:hover {
                    background-color: #45a049;
                }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PizzaTime</h1>
            <p>Chọn món ưa thích của bạn</p>
            <div class="cart-icon" id="cart-icon">
                <img src="https://img.icons8.com/ios-filled/50/ffffff/shopping-cart.png" alt="Cart">
                <span id="cart-badge">0</span>
            </div>
        </header>
        <div class="table-info" id="tableInfo">Đang tải thông tin bàn...</div>
        <div id="menu-container"></div>
    </div>

    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
