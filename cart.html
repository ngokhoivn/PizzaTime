<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - PizzaTime</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .table-info {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
            padding: 10px;
            background-color: #f0f8ff;
            border-radius: 8px;
            border: 1px solid #b0c4de;
        }

        .order-summary {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

            .order-summary h2 {
                border-bottom: 2px solid #4CAF50;
                padding-bottom: 10px;
                margin-bottom: 15px;
                color: #4CAF50;
            }

        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #eee;
        }

        .submit-order {
            display: block;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 20px;
        }

            .submit-order:hover {
                background-color: #45a049;
            }

            .submit-order:disabled {
                background-color: #cccccc;
                cursor: not-allowed;
            }

        .back-btn {
            display: block;
            width: 100%;
            background-color: #666;
            color: white;
            padding: 15px;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
        }

            .back-btn:hover {
                background-color: #555;
            }

        .empty-order {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

            .modal-content button {
                background-color: #4CAF50;
                color: white;
                padding: 10px 20px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                margin-top: 20px;
            }

                .modal-content button:hover {
                    background-color: #45a049;
                }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PizzaTime - Giỏ hàng</h1>
        </header>
        <div class="table-info" id="tableInfo">Đang tải thông tin bàn...</div>
        <div class="order-summary" id="orderSummary">
            <h2>Giỏ hàng của bạn</h2>
            <div id="orderItems"></div>
            <div class="total">
                <span>Tổng cộng:</span>
                <span id="totalAmount">0 ₫</span>
            </div>
            <button class="submit-order" disabled>Đặt món</button>
            <button class="back-btn" onclick="window.location.href='QuetMaQr.html?table=' + tableNumber">Quay lại menu</button>
        </div>
    </div>

    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button onclick="closeModal()">Đóng</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
