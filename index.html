<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách bàn - PizzaTime</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #4CAF50;
        }

        .table-links {
            margin-top: 20px;
        }

            .table-links a {
                display: block;
                margin: 10px 0;
                padding: 10px;
                background-color: #4CAF50;
                color: white;
                text-decoration: none;
                border-radius: 5px;
                width: 200px;
                margin-left: auto;
                margin-right: auto;
            }

                .table-links a:hover {
                    background-color: #45a049;
                }
    </style>
</head>
<body>
    <h1>Chọn bàn để đặt món</h1>
    <div class="table-links">
        <script>
            for (let i = 1; i <= 16; i++) {
                document.write(`<a href="./QuetMaQr.html?table=${i}">Bàn ${i}</a>`);
            }
        </script>
    </div>
</body>
</html>
